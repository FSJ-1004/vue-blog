<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>范帅杰 · 技术笔记</title>
    <meta
      name="description"
      content="前端开发方向的技术笔记：Vue、构建工具、性能优化与工程化实践。"
    />
    <meta property="og:title" content="范帅杰 · 技术笔记" />
    <meta property="og:description" content="前端开发方向的技术笔记：Vue、构建工具、性能优化与工程化实践。" />
    <meta property="og:type" content="website" />
    <!-- 必须在首帧渲染前决定主题，否则深色模式会先闪一下白 -->
    <script>
      ;(function () {
        try {
          var saved = localStorage.getItem('blog-theme')
          var dark = saved
            ? saved === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
